name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Tests import pi's own packages; install pi the way users do and link it in.
      - name: Install pi
        run: npm install --prefix "$RUNNER_TEMP/pi" @earendil-works/pi-coding-agent@latest
      - run: node scripts/link-pi.mjs "$RUNNER_TEMP/pi/node_modules"
      - run: npm test
      - run: npm run check
